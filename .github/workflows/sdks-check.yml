name: openwop-sdks — check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: TS build + Python smoke + Go vet/test + parity + release-surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      # ruff is the Python 2.x lint gate (sdks-check.sh step 5).
      - run: pip install ruff
      - name: Standalone SDK gate
        run: npm run check
