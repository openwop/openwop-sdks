[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "openwop-client"
version = "1.5.0"
description = "Production-ready Python reference SDK for OpenWOP v1.0 compliant servers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "openwop spec working group" }]
keywords = ["openwop", "workflow", "orchestration", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

# Zero-dep policy mirrors the TypeScript SDK — keeps audit surface small
# and the package install lightweight. v1.0 uses stdlib `urllib` for HTTP
# and a hand-rolled SSE parser. v1.x may add an optional `httpx` extra
# for async support.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.10",
]

[project.urls]
"Homepage" = "https://github.com/openwop/openwop-sdks"
"Source" = "https://github.com/openwop/openwop-sdks"
"Bug Tracker" = "https://github.com/openwop/openwop-sdks/issues"
"Changelog" = "https://github.com/openwop/openwop-sdks/blob/main/sdk/python/CHANGELOG.md"
"Spec corpus" = "https://github.com/openwop/openwop/tree/main/spec/v1/"

[tool.hatch.build.targets.wheel]
packages = ["src/openwop_client"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_decorators = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Ruff is pinned here so lint + format behavior is deterministic across ruff
# versions (the enforced gate is `ruff check`, run in dev + PR review; `ruff
# format` is NOT run in CI — hand-wrapped call style is intentional). `select`
# restates ruff's historical default set explicitly so a future ruff default
# change can't silently alter what the lint gate checks.
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
