[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "openwop-client"
version = "2.0.0rc1"
description = "Production-ready Python reference SDK for OpenWOP v2 hosts — bare-origin unversioned paths, OpenWOP-Version negotiation, the closed discovery root, and the generated error-code registry."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "openwop spec working group" }]
keywords = ["openwop", "workflow", "orchestration", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

# Zero-dep policy mirrors the TypeScript SDK — keeps audit surface small
# and the package install lightweight: stdlib `urllib` for HTTP and a
# hand-rolled SSE parser.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.10",
  "ruff>=0.6",
]

[project.urls]
"Homepage" = "https://github.com/openwop/openwop-sdks"
"Source" = "https://github.com/openwop/openwop-sdks/tree/main/sdk/python-v2"
"Bug Tracker" = "https://github.com/openwop/openwop-sdks/issues"
"Changelog" = "https://github.com/openwop/openwop-sdks/blob/main/sdk/python-v2/CHANGELOG.md"
"Spec corpus" = "https://github.com/openwop/openwop/tree/main/spec/v2/"

[tool.hatch.build.targets.wheel]
packages = ["src/openwop_client"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_decorators = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# The enforced lint gate is `ruff check` (scripts/sdks-check.sh). `select`
# restates ruff's historical default set explicitly so a future ruff default
# change can't silently alter what the gate checks.
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
